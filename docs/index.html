<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Trae 签到看板</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #262d38;
    --text: #e6edf3;
    --muted: #8b949e;
    --ok: #3fb950;
    --warn: #d29922;
    --fail: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -20%, #1b2534 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
          "Helvetica Neue", Arial, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 16px 40px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 12px; }
  .summary {
    margin: 20px 0 14px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .big { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .summary .label { color: var(--muted); font-size: 12px; }
  .divider { width: 1px; align-self: stretch; background: var(--border); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .name { font-weight: 600; font-size: 15px; }
  .uid { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pill {
    font-size: 12px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .ok { color: var(--ok); }
  .fail { color: var(--fail); }
  .warn { color: var(--warn); }
  .msg { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .metrics { display: flex; gap: 18px; margin-top: 10px; }
  .metric .k { color: var(--muted); font-size: 11px; }
  .metric .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  a.btn {
    display: inline-block; margin-top: 6px; padding: 9px 16px;
    border-radius: 10px; border: 1px solid var(--border);
    color: var(--accent); text-decoration: none; font-size: 13px;
  }
  a.btn:hover { background: #1f2632; }
  footer { margin-top: 22px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; display: inline-block; vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toggle { cursor: pointer; user-select: none; }
  .field { margin-top: 12px; }
  .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  textarea, input[type="password"] {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: #0d1117; color: var(--text); border: 1px solid var(--border);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: vertical;
  }
  textarea:focus, input[type="password"]:focus { outline: none; border-color: var(--accent); }
  button.btn {
    margin-top: 12px; padding: 9px 16px; border-radius: 10px; cursor: pointer;
    background: #1f6feb; color: #fff; border: 1px solid #1f6feb; font-size: 13px;
  }
  button.btn:disabled { opacity: .55; cursor: default; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Trae 签到看板</h1>
    <span class="sub" id="updated">加载中…</span>
  </header>

  <section class="summary" id="summary" hidden>
    <div>
      <div class="big" id="okCount">-</div>
      <div class="label">今日完成</div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="big" id="creditSum">-</div>
      <div class="label">今日积分</div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="big" id="balanceSum">-</div>
      <div class="label">可用余额</div>
    </div>
  </section>

  <main id="list"><div class="empty"><span class="spinner"></span> 正在读取签到状态</div></main>

  <section class="card" id="addCard" hidden>
    <div class="row toggle" id="addToggle">
      <span class="name">＋ 添加账号</span>
      <span class="sub" id="addState">展开</span>
    </div>
    <div id="addBody" hidden>
      <div class="note" id="curAcc">现有账号：读取中…</div>

      <div class="field">
        <label>accounts.json 内容（整体覆盖，请包含所有账号）</label>
        <textarea id="accJson" rows="7" spellcheck="false"
          placeholder='[{ "name": "用户xxx", "token": "eyJ...", "device_id": "...", "user_id": "...", "region": "CN" }]'></textarea>
      </div>

      <div class="field">
        <label>GitHub 令牌（classic PAT，勾选 repo；只存在内存，刷新即消失）</label>
        <input id="ghPat" type="password" autocomplete="off" placeholder="ghp_..." />
      </div>

      <button class="btn" id="saveBtn">写入 Secret 并生效</button>
      <div class="note" id="saveMsg"></div>
      <div class="note">
        令牌权限只用于本仓库的 Actions Secrets。写入后到
        <a class="sub" id="runNow" href="#">Actions</a> 点 Run workflow 验证。
      </div>
    </div>
  </section>

  <footer>
    <a class="btn" id="runLink" href="#" hidden>查看运行记录</a>
    <a class="btn" id="actionLink" href="#">手动触发签到</a>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/bundles/libsodium-wrappers.js"></script>
<script>
  const list = document.getElementById('list');
  const updated = document.getElementById('updated');
  const summary = document.getElementById('summary');
  const owner = location.hostname.split('.')[0];
  const repo = location.pathname.split('/')[1];
  const onGithub = location.hostname.endsWith('github.io') && !!repo;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function render(data) {
    const accounts = data.accounts || [];
    const ok = accounts.filter(a => a.ok).length;
    const creditSum = accounts.reduce((s, a) => s + (a.credited || 0), 0);
    const balances = accounts.map(a => a.balance).filter(v => typeof v === 'number');
    const balanceSum = balances.reduce((s, v) => s + v, 0);

    document.getElementById('okCount').textContent = ok + '/' + accounts.length;
    document.getElementById('creditSum').textContent = '+' + creditSum;
    document.getElementById('balanceSum').textContent = balances.length ? balanceSum : '—';
    updated.textContent = '更新于 ' + (data.updated_at || '未知');
    summary.hidden = false;

    const curAcc = document.getElementById('curAcc');
    if (curAcc) {
      curAcc.textContent = accounts.length
        ? '现有账号：' + accounts.map(a => a.name || a.user_id).join('、') + `（共 ${accounts.length} 个）`
        : '现有账号：暂无';
    }

    if (data.run_url) {
      const link = document.getElementById('runLink');
      link.href = data.run_url;
      link.hidden = false;
    }

    list.textContent = '';
    if (!accounts.length) {
      list.appendChild(el('div', 'empty', '还没有账号数据，先在仓库里配置 TRAE_ACCOUNTS。'));
      return;
    }
    for (const a of accounts) {
      const card = el('div', 'card');
      const row = el('div', 'row');
      row.appendChild(el('span', 'name', a.name || '未命名'));
      const pill = el('span', 'pill ' + (a.ok ? 'ok' : 'fail'),
                      a.checked_in ? '已签到' : '未完成');
      row.appendChild(pill);
      card.appendChild(row);

      if (a.user_id) card.appendChild(el('div', 'uid', 'ID ' + a.user_id));
      if (a.message) card.appendChild(el('div', 'msg', a.message));

      const metrics = el('div', 'metrics');
      const addMetric = (k, v) => {
        const m = el('div', 'metric');
        m.appendChild(el('div', 'v', v));
        m.appendChild(el('div', 'k', k));
        metrics.appendChild(m);
      };
      addMetric('今日获得', a.credited ? '+' + a.credited : '—');
      addMetric('可用余额', typeof a.balance === 'number' ? a.balance : '—');
      card.appendChild(metrics);
      list.appendChild(card);
    }
  }

  async function load() {
    const repo = location.pathname.split('/')[1];
    const actionLink = document.getElementById('actionLink');
    if (repo && location.hostname.endsWith('github.io')) {
      actionLink.href = `https://github.com/${location.hostname.split('.')[0]}/${repo}/actions/workflows/checkin.yml`;
    } else {
      actionLink.hidden = true;
    }

    try {
      const res = await fetch('status.json?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      render(await res.json());
    } catch (e) {
      list.textContent = '';
      list.appendChild(el('div', 'empty', '还没有运行记录。点下面的「手动触发签到」，跑完刷新即可。'));
      updated.textContent = '暂无数据';
    }
  }

  // ---- 添加账号：直接把账号写入仓库 Secret ----
  const addCard = document.getElementById('addCard');
  const addBody = document.getElementById('addBody');
  const addToggle = document.getElementById('addToggle');
  const addState = document.getElementById('addState');
  const saveBtn = document.getElementById('saveBtn');
  const saveMsg = document.getElementById('saveMsg');

  function setMsg(text, cls) {
    saveMsg.textContent = text;
    saveMsg.className = 'note ' + (cls || '');
  }

  if (onGithub) {
    addCard.hidden = false;
    document.getElementById('runNow').href =
      `https://github.com/${owner}/${repo}/actions/workflows/checkin.yml`;

    addToggle.addEventListener('click', () => {
      const open = addBody.hidden;
      addBody.hidden = !open;
      addState.textContent = open ? '收起' : '展开';
    });

    saveBtn.addEventListener('click', async () => {
      const pat = document.getElementById('ghPat').value.trim();
      const raw = document.getElementById('accJson').value.trim();
      if (!raw) return setMsg('先把 accounts.json 的内容粘进来', 'warn');
      if (!pat) return setMsg('还需要填 GitHub 令牌', 'warn');

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        return setMsg('JSON 解析失败：' + e.message, 'fail');
      }
      if (!Array.isArray(parsed)) parsed = [parsed];
      if (!parsed.length || parsed.some(a => !a || typeof a !== 'object' || !a.user_id)) {
        return setMsg('格式不对：需要包含 user_id 的账号对象数组', 'fail');
      }

      saveBtn.disabled = true;
      setMsg('正在写入…');
      try {
        await sodium.ready;
        const headers = { Authorization: 'Bearer ' + pat, Accept: 'application/vnd.github+json' };
        const kres = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/actions/secrets/public-key`,
          { headers });
        if (!kres.ok) throw new Error(`读取公钥失败 HTTP ${kres.status}（令牌权限不足或已失效）`);
        const { key_id, key } = await kres.json();

        const sealed = sodium.crypto_box_seal(
          sodium.from_string(JSON.stringify(parsed)),
          sodium.from_base64(key, sodium.base64_variants.ORIGINAL));

        const res = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/actions/secrets/TRAE_ACCOUNTS`,
          {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              encrypted_value: sodium.to_base64(sealed, sodium.base64_variants.ORIGINAL),
              key_id,
            }),
          });
        if (!res.ok) throw new Error(`写入失败 HTTP ${res.status}（令牌需要 Secrets 写权限）`);

        document.getElementById('ghPat').value = '';
        setMsg(`已写入 ${parsed.length} 个账号，去 Actions 点 Run workflow 验证`, 'ok');
      } catch (e) {
        setMsg('失败：' + e.message, 'fail');
      } finally {
        saveBtn.disabled = false;
      }
    });
  }

  load();
</script>
</body>
</html>
